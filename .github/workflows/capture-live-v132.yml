name: capture-live-v132

on:
  push:
    branches:
      - ops/capture-live-v132
    paths:
      - .github/workflows/capture-live-v132.yml

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Capture production state
        run: |
          python - <<'PY'
          import asyncio, json
          from mcp import Client

          ENDPOINT = 'https://sao-aincrad-mcp-production.up.railway.app/mcp'
          ACTORS = [
              'pc_419ba4144d33','pc_friend_mio','pc_friend_sumika','pc_friend_sayo',
              'pc_friend_kotone','pc_friend_rin','pc_friend_reina','pc_friend_chikage'
          ]

          def text_json(result):
              return json.loads(result.content[0].text)

          async def main():
              async with Client(ENDPOINT, raise_exceptions=True) as client:
                  print('HEALTH', json.dumps(text_json(await client.call_tool('health', {})), ensure_ascii=False))
                  for actor_id in ACTORS:
                      try:
                          state = text_json(await client.call_tool('get_character_state', {'actor_id': actor_id}))
                          print('ACTOR', actor_id, json.dumps(state, ensure_ascii=False))
                      except Exception as exc:
                          print('ACTOR_ERROR', actor_id, repr(exc))
                  try:
                      obs = text_json(await client.call_tool('get_gm_observation', {'observer_actor_ids':['pc_419ba4144d33','pc_friend_reina']}))
                      print('OBS', json.dumps(obs, ensure_ascii=False))
                  except Exception as exc:
                      print('OBS_ERROR', repr(exc))
                  try:
                      save = await client.call_tool('export_save_json', {})
                      print('EXPORT_OK', len(save.content[0].text))
                  except Exception as exc:
                      print('EXPORT_ERROR', repr(exc))
          asyncio.run(main())
          PY
