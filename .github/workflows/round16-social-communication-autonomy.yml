name: Round 16 Social Communication Autonomy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round16 social communication autonomy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply social communication autonomy closure
        run: |
          python scripts/round16_builder_fix.py
          python scripts/round16_social_communication_autonomy_patch.py
          python scripts/round16_social_fix.py
      - name: Verify social communication autonomy
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src
          pytest -q
      - name: Commit verified social communication autonomy
        run: |
          git config user.name 'starmerx-luxuyan'
          git config user.email 'luxuyan@starmerx.com'
          git add src/sao_mcp/rules/communications.py src/sao_mcp/rules/npcs.py src/sao_mcp/rules/social_communication.py src/sao_mcp/runtime/communications_runtime.py src/sao_mcp/runtime/knowledge_runtime.py src/sao_mcp/runtime/social_communication_runtime.py src/sao_mcp/runtime/persistence.py src/sao_mcp/server_social_autonomy.py src/sao_mcp/server_bootstrap.py tests/test_social_communication_autonomy.py tests/test_social_communication_authority.py tests/test_quest_ecology_authority.py tests/test_monster_ecology_authority.py tests/test_economy_loop_authority.py tests/test_server_bootstrap.py
          git diff --cached --quiet && exit 1
          git commit -m 'Seal social and communication autonomy'
          git push origin HEAD:main
