name: Round 16 Social Communication Autonomy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round16 social communication autonomy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final social authority audit
        run: python scripts/round16_social_audit_fix.py
      - name: Verify social communication autonomy
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src
          pytest -q
      - name: Commit verified social authority audit
        run: |
          git config user.name 'starmerx-luxuyan'
          git config user.email 'luxuyan@starmerx.com'
          git add src/sao_mcp/runtime/social_communication_runtime.py tests/test_knowledge_authority_source.py
          git diff --cached --quiet && exit 1
          git commit -m 'Keep social propagation behind knowledge authority'
          git push origin HEAD:main
