name: Round 9 Knowledge Core

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round9 knowledge core migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply knowledge-core migration
        run: python scripts/round9_knowledge_core.py
      - name: Verify knowledge core
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q
      - name: Commit verified knowledge core
        run: |
          git config user.name "starmerx-luxuyan"
          git config user.email "luxuyan@starmerx.com"
          git add src/sao_mcp/rules/knowledge.py src/sao_mcp/runtime/knowledge_runtime.py src/sao_mcp/rules/npc_actor_core.py src/sao_mcp/runtime/npc_autonomy_runtime.py src/sao_mcp/runtime/gm_turn.py src/sao_mcp/server_gm.py tests/test_knowledge_runtime.py tests/test_npc_autonomy.py tests/test_knowledge_authority_source.py
          git diff --cached --quiet && exit 1
          git commit -m "Seal causal NPC knowledge and belief provenance"
          git push origin HEAD:main
