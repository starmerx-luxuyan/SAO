name: Round 14 Monster Ecology

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round14 monster ecology'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply monster ecology closure
        run: |
          python scripts/round14_monster_ecology_patch.py
          python scripts/round14_monster_ecology_testfix.py
      - name: Verify monster ecology
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q
      - name: Commit verified monster ecology
        run: |
          git config user.name "starmerx-luxuyan"
          git config user.email "luxuyan@starmerx.com"
          git add src/sao_mcp/rules/monster_ecology.py src/sao_mcp/runtime/monster_ecology_runtime.py src/sao_mcp/server_ecology.py src/sao_mcp/runtime/engine.py src/sao_mcp/rules/economy_loop.py src/sao_mcp/runtime/property_economy.py src/sao_mcp/runtime/persistence.py src/sao_mcp/server_bootstrap.py tests/test_monster_ecology.py tests/test_monster_ecology_authority.py tests/test_economy_loop_authority.py tests/test_server_bootstrap.py
          git diff --cached --quiet && exit 1
          git commit -m "Seal living monster and spawn ecology"
          git push origin HEAD:main
