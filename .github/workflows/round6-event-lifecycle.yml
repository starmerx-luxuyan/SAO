name: Round 6 Event Lifecycle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round6 event lifecycle migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply event lifecycle migration
        run: python scripts/round6_event_lifecycle.py
      - name: Verify event lifecycle
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q
      - name: Commit verified event lifecycle
        run: |
          git config user.name "starmerx-luxuyan"
          git config user.email "luxuyan@starmerx.com"
          git add src/sao_mcp/rules/world_events.py src/sao_mcp/runtime/world_event_runtime.py src/sao_mcp/scenarios/floor4_nocturne.py src/sao_mcp/server_floor4_nocturne.py tests/test_world_event_runtime.py tests/test_world_event_authority.py tests/test_floor8_emergency.py
          git diff --cached --quiet && exit 1
          git commit -m "Add interruptible world-event lifecycle"
          git push origin HEAD:main
