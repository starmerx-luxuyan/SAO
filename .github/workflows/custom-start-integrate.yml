name: Custom Start Integration

on:
  push:
    branches:
      - custom-start-v1.1-round3

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply v1.1 candidate and custom-start rounds
        run: |
          cat .integration/v11.* | base64 -d | gzip -d > /tmp/v11.patch
          git apply --check /tmp/v11.patch
          git apply /tmp/v11.patch

          cat .integration/r23.* | base64 -d | gzip -d > /tmp/r23.patch
          git apply --check /tmp/r23.patch
          git apply /tmp/r23.patch

          cp .integration/ci.yml .github/workflows/ci.yml
          rm -rf .integration .github/workflows/custom-start-integrate.yml APPLY_NOTES.md
      - name: Validate integrated source
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q
      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate authoritative custom-start rounds 1-3"
          git push origin HEAD:custom-start-v1.1-round3
