name: Round 13 Economy Loop

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round13 economy loop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply economy-loop closure
        run: python scripts/round13_economy_loop_patch.py
      - name: Verify economy loop
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q
      - name: Commit verified economy loop
        run: |
          git config user.name "starmerx-luxuyan"
          git config user.email "luxuyan@starmerx.com"
          git add src/sao_mcp/rules/economy_loop.py src/sao_mcp/rules/economy.py src/sao_mcp/runtime/property_economy.py src/sao_mcp/runtime/economy_loop_runtime.py src/sao_mcp/corpus/economy.py src/sao_mcp/runtime/community_runtime.py src/sao_mcp/rules/relationships.py src/sao_mcp/runtime/community_hooks.py src/sao_mcp/server_bootstrap.py src/sao_mcp/runtime/persistence.py src/sao_mcp/server_economy.py tests/test_economy_loop.py tests/test_economy_loop_authority.py tests/test_server_bootstrap.py
          git diff --cached --quiet && exit 1
          git commit -m "Seal living Aincrad economy loop"
          git push origin HEAD:main
