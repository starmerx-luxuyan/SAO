name: floor22-lazy-v132

on:
  push:
    branches:
      - fix/floor22-lazy-v132
    paths:
      - .github/workflows/floor22-lazy-v132.yml

jobs:
  locate-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate dynamic connection flag writes
        run: |
          grep -RIn "dynamic_world_connection_ids" src tests scripts || true
          grep -RIn "global_flags.*connection\|connection_ids\|setdefault.*global_flags" src/sao_mcp | head -n 200 || true
