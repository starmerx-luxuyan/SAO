name: floor22-lazy-v132

on:
  push:
    branches:
      - fix/floor22-lazy-v132
    paths:
      - .github/workflows/floor22-lazy-v132.yml

jobs:
  diagnose-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply candidate patches
        run: |
          python scripts/apply_floor22_lazy_v132.py
          python scripts/apply_floor22_lazy_v132_part2.py
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Diff Floor 22 hosted save roundtrip
        run: |
          python - <<'PY'
          import json
          from sao_mcp.runtime.persistence import export_runtime, import_runtime
          from sao_mcp.runtime.social_communication_runtime import SocialCommunicationAincradRuntime
          from sao_mcp.scenarios.floor22_witch import install_floor22_witch_scenario
          from sao_mcp.corpus.floor22 import FOREST_SITE, TOTO_ID

          source = SocialCommunicationAincradRuntime(seed=136)
          scenario = install_floor22_witch_scenario(source)
          player = source.create_character('Floor22Persist', level=30)
          source.world.floors[22].unlocked = True
          player.location_id = FOREST_SITE
          scenario.start([player.actor_id])
          before_text = export_runtime(source)
          before = json.loads(before_text)

          restored = SocialCommunicationAincradRuntime(seed=137)
          install_floor22_witch_scenario(restored)
          import_runtime(before_text, into=restored)
          after_text = export_runtime(restored)
          after = json.loads(after_text)

          def compact(value):
              if isinstance(value, dict):
                  return {'type':'dict','len':len(value),'keys':list(value)[:20]}
              if isinstance(value, list):
                  return {'type':'list','len':len(value),'head':value[:3]}
              return value

          def walk(a, b, path=''):
              diffs=[]
              if type(a) is not type(b):
                  return [(path, compact(a), compact(b))]
              if isinstance(a, dict):
                  for key in sorted(set(a)|set(b)):
                      p=f'{path}.{key}' if path else key
                      if key not in a or key not in b:
                          diffs.append((p, compact(a.get(key)), compact(b.get(key))))
                      elif a[key] != b[key]:
                          diffs.extend(walk(a[key], b[key], p))
                          if len(diffs) >= 80:
                              break
              elif isinstance(a, list):
                  if len(a) != len(b):
                      diffs.append((path+'.length', len(a), len(b)))
                  for i,(x,y) in enumerate(zip(a,b)):
                      if x != y:
                          diffs.extend(walk(x,y,f'{path}[{i}]'))
                          if len(diffs) >= 80:
                              break
              elif a != b:
                  diffs.append((path,a,b))
              return diffs

          diffs=walk(before,after)
          print('EXACT_EQUAL', before_text == after_text)
          print('TOTO_SOURCE', TOTO_ID in source.npcs.states, TOTO_ID in source.npc_actor_cores)
          print('TOTO_RESTORED', TOTO_ID in restored.npcs.states, TOTO_ID in restored.npc_actor_cores)
          print('DIFF_COUNT_SHOWN', len(diffs))
          for path,left,right in diffs[:80]:
              print('DIFF', path, 'BEFORE=', json.dumps(left,ensure_ascii=False,sort_keys=True), 'AFTER=', json.dumps(right,ensure_ascii=False,sort_keys=True))
          PY
