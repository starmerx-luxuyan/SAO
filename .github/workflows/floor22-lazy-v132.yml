name: floor22-lazy-v132

on:
  push:
    branches:
      - fix/floor22-lazy-v132
    paths:
      - .github/workflows/floor22-lazy-v132.yml

jobs:
  prove-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply lazy Floor 22 patch
        run: |
          python scripts/apply_floor22_lazy_v132.py
          python scripts/apply_floor22_lazy_v132_part2.py
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_floor22_lazy_materialization.py')
          text = p.read_text(encoding='utf-8')
          old = 'from __future__ import annotations\n\n'
          new = 'from __future__ import annotations\n\nimport sys\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parents[1]))\n\n'
          if text.count(old) != 1:
              raise RuntimeError('unexpected test preamble')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install patched tree
        run: python -m pip install -e ".[dev]"
      - name: Prove lifecycle and registry isolation
        run: |
          python - <<'PY'
          from sao_mcp.runtime.housing_runtime import HousingAincradRuntime
          from sao_mcp.scenarios.floor22_witch import install_floor22_witch_scenario
          from sao_mcp.corpus.floor22 import FOREST_SITE, TOTO_ID
          from sao_mcp.rules.npcs import CORE_NPCS

          runtime = HousingAincradRuntime(seed=111)
          scenario = install_floor22_witch_scenario(runtime)
          assert TOTO_ID not in runtime.npcs.states
          assert TOTO_ID not in runtime.npc_actor_cores
          player = runtime.create_character('Floor22Proof', level=30)
          runtime.world.floors[22].unlocked = True
          player.location_id = FOREST_SITE
          scenario.start([player.actor_id])
          assert TOTO_ID in runtime.npcs.states
          assert TOTO_ID in runtime.npc_actor_cores
          assert TOTO_ID not in CORE_NPCS

          fresh = HousingAincradRuntime(seed=112)
          assert TOTO_ID not in fresh.npcs.definitions
          assert TOTO_ID not in fresh.npcs.states
          print({'lazyLifecycle': True, 'registryIsolation': True})
          PY
      - name: Compile and full regression
        run: |
          python -m compileall -q src
          pytest -q
      - name: Exact recovery roundtrip with hosted scenario registry
        run: |
          python - <<'PY'
          import json
          from scripts.build_kageaki_frontline_recovery_v132 import build_recovery
          from sao_mcp.runtime.persistence import export_runtime, import_runtime
          from sao_mcp.runtime.social_communication_runtime import SocialCommunicationAincradRuntime
          from sao_mcp.scenarios.floor22_witch import install_floor22_witch_scenario
          from sao_mcp.corpus.floor22 import TOTO_ID

          save = build_recovery()
          runtime = SocialCommunicationAincradRuntime(seed=41)
          install_floor22_witch_scenario(runtime)
          assert TOTO_ID not in runtime.npcs.states
          import_runtime(save, into=runtime)
          assert export_runtime(runtime) == save
          assert TOTO_ID not in runtime.npcs.states
          assert TOTO_ID not in runtime.npc_actor_cores
          print(json.dumps({'exactRoundTrip': True, 'futureTotoMaterialized': False}))
          PY
      - name: Commit tested patch
        run: |
          rm scripts/apply_floor22_lazy_v132.py scripts/apply_floor22_lazy_v132_part2.py .github/workflows/floor22-lazy-v132.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: isolate NPC registries and lazily materialize Floor 22 actors"
          git push origin HEAD:fix/floor22-lazy-v132
