name: floor22-lazy-v132

on:
  push:
    branches:
      - fix/floor22-lazy-v132
    paths:
      - .github/workflows/floor22-lazy-v132.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locate Floor 22 eager materialization
        run: |
          grep -RInE 'npc_floor22_toto|TOTO_ID|floor22_toto_definition|install_floor22_npc|install_floor22_witch_scenario' src tests | head -n 300 || true
          python -m pip install -e . >/dev/null
          python - <<'PY'
          from sao_mcp.runtime.housing_runtime import HousingAincradRuntime
          from sao_mcp.runtime.social_communication_runtime import SocialCommunicationAincradRuntime
          from sao_mcp.corpus.floor22 import TOTO_ID
          for cls in (HousingAincradRuntime, SocialCommunicationAincradRuntime):
              runtime = cls(seed=101)
              print('CLASS', cls.__name__)
              print('MRO', [c.__name__ for c in cls.__mro__])
              print('TOTO_DEF', TOTO_ID in runtime.npcs.definitions)
              print('TOTO_STATE', TOTO_ID in runtime.npcs.states)
              print('TOTO_CORE', TOTO_ID in getattr(runtime, 'npc_actor_cores', {}))
          PY
