name: Round 10 NPC Scheduler

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round10 NPC scheduler integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply scheduler integration
        run: python scripts/round10_npc_scheduler_patch.py
      - name: Verify scheduler
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q
      - name: Commit verified scheduler
        run: |
          git config user.name "starmerx-luxuyan"
          git config user.email "luxuyan@starmerx.com"
          git add src/sao_mcp/rules/npc_scheduler.py src/sao_mcp/rules/npc_actor_core.py src/sao_mcp/rules/npc_autonomy.py src/sao_mcp/runtime/npc_scheduler_runtime.py src/sao_mcp/runtime/guild_autonomy_runtime.py src/sao_mcp/runtime/npc_autonomy_runtime.py src/sao_mcp/rules/live_state.py src/sao_mcp/rules/travel.py src/sao_mcp/runtime/engine.py src/sao_mcp/runtime/world_event_runtime.py src/sao_mcp/runtime/persistence.py src/sao_mcp/runtime/gm_turn.py src/sao_mcp/server_gm.py tests/test_npc_scheduler.py tests/test_npc_scheduler_authority.py
          git diff --cached --quiet && exit 1
          git commit -m "Seal world-time NPC scheduler"
          git push origin HEAD:main
