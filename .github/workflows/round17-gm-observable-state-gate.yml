name: Round 17 GM Observable State Gate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round17 gm observable state gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final GM visibility audit
        run: python scripts/round17_gm_observable_state_gate_audit_fix.py
      - name: Verify GM observable-state gate
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src
          pytest -q
      - name: Commit verified GM visibility audit
        run: |
          git config user.name 'starmerx-luxuyan'
          git config user.email 'luxuyan@starmerx.com'
          git add src/sao_mcp/runtime/gm_observation.py tests/test_gm_observation_gate.py
          git diff --cached --quiet && exit 1
          git commit -m 'Hide unread message content from GM observation'
          git push origin HEAD:main
