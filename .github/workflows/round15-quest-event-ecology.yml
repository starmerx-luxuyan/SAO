name: Round 15 Quest Event Ecology

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round15 quest event ecology'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply final quest-event ecology audit
        run: python scripts/round15_quest_event_ecology_audit_fix.py
      - name: Verify quest-event ecology
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q
      - name: Commit verified quest-event ecology audit
        run: |
          git config user.name "starmerx-luxuyan"
          git config user.email "luxuyan@starmerx.com"
          git add src/sao_mcp/rules/quests.py src/sao_mcp/runtime/quest_ecology_runtime.py src/sao_mcp/server_adventure.py src/sao_mcp/server_quest_ecology.py tests/test_quest_ecology.py tests/test_quest_ecology_authority.py
          git diff --cached --quiet && exit 1
          git commit -m "Seal quest ecology visibility and winner provenance"
          git push origin HEAD:main
