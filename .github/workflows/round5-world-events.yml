name: Round 5 World Events

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round5 Witch return and transition gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Witch return and transition gate
        run: python scripts/round5_witch_and_gate.py
      - name: Verify final round5 state
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q
      - name: Commit verified final round5 state
        run: |
          git config user.name "starmerx-luxuyan"
          git config user.email "luxuyan@starmerx.com"
          git add src/sao_mcp/scenarios/floor22_witch.py src/sao_mcp/server_floor22.py tests/test_floor22_witch_quest.py tests/test_floor8_standoff.py tests/test_world_event_authority.py
          git diff --cached --quiet && exit 1
          git commit -m "Make Witch return event-driven and lock transition classification"
          git push origin HEAD:main
