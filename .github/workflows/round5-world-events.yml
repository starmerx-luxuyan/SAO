name: Round 5 World Events

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round5 world event migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Floor 6 conditional event migration
        run: python scripts/round5_floor6_events.py
      - name: Verify migration
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q
      - name: Commit verified migration
        run: |
          git config user.name "starmerx-luxuyan"
          git config user.email "luxuyan@starmerx.com"
          git add src/sao_mcp/scenarios/floor6_buxum.py src/sao_mcp/scenarios/floor6_irrational_cube.py src/sao_mcp/scenarios/floor6_stachion.py src/sao_mcp/server_floor6.py src/sao_mcp/server_floor6_buxum.py tests/test_floor6_irrational_cube.py tests/test_floor6_stachion.py tests/test_world_event_authority.py
          git diff --cached --quiet && exit 1
          git commit -m "Move Floor 6 conditional scenes into world events"
          git push origin HEAD:main
