name: Round 5 World Events

on:
  push:
    branches: [main]

jobs:
  audit:
    if: github.event.head_commit.message == 'Run round5 final event audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit remaining scenario transition methods
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          root = Path('src/sao_mcp/scenarios')
          prefixes = ('trigger_', 'advance_', 'resolve_', 'finish_', 'complete_')
          for path in sorted(root.glob('*.py')):
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              tree = ast.parse(text)
              for node in ast.walk(tree):
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  if not node.name.startswith(prefixes):
                      continue
                  args = [arg.arg for arg in node.args.args if arg.arg != 'self']
                  end = min(len(lines), node.lineno + 9)
                  preview = ' | '.join(
                      line.strip() for line in lines[node.lineno-1:end] if line.strip()
                  )
                  print(f'{path.name}:{node.lineno}:{node.name}:args={args} :: {preview}')
          PY
