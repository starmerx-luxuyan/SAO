name: Round 5 World Events

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round5 remaining event migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply remaining conditional event migration
        run: python scripts/round5_more_events_c2.py
      - name: Verify migration
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q
      - name: Commit verified migration
        run: |
          git config user.name "starmerx-luxuyan"
          git config user.email "luxuyan@starmerx.com"
          git add src/sao_mcp/runtime/world_event_runtime.py src/sao_mcp/scenarios/floor6_elfwar.py src/sao_mcp/scenarios/floor8_standoff.py src/sao_mcp/scenarios/floor8_sluva.py src/sao_mcp/server_floor6_elfwar.py src/sao_mcp/server_floor8.py tests/test_floor6_stachion.py tests/test_floor8_standoff.py tests/test_floor8_sluva.py tests/test_world_event_authority.py
          git diff --cached --quiet && exit 1
          git commit -m "Convert remaining pure scene conditions to world events"
          git push origin HEAD:main
