name: Round 5 World Events

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round5 post-defeat event migration v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply post-defeat event migration
        run: |
          python scripts/round5_more_events_c1.py
          python scripts/round5_more_events_c1_fixes.py
      - name: Verify migration
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q
      - name: Commit verified migration
        run: |
          git config user.name "starmerx-luxuyan"
          git config user.email "luxuyan@starmerx.com"
          git add src/sao_mcp/runtime/world_event_runtime.py src/sao_mcp/scenarios/floor6_buxum.py src/sao_mcp/scenarios/floor6_stachion.py src/sao_mcp/scenarios/floor5_fuscus.py src/sao_mcp/scenarios/floor7_pursuit.py src/sao_mcp/server_floor5.py src/sao_mcp/server_floor7.py tests/test_floor5_fuscus_flag.py tests/test_floor7_pursuit.py tests/test_world_event_authority.py
          git diff --cached --quiet && exit 1
          git commit -m "Resolve defeat-driven scene transitions as world events"
          git push origin HEAD:main
