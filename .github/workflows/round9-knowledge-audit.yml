name: Round 9 Knowledge Audit

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.head_commit.message == 'Run round9 knowledge audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit knowledge callsites
        run: |
          echo '=== knowledge mutation/read callsites ==='
          grep -RInE 'record_observation|record_inference|share_known_fact|\.belief\(' src tests || true
          echo '=== direct knowledge_events access in source ==='
          grep -RIn 'knowledge_events' src || true
