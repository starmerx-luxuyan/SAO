name: Round 4 Live State Core

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round4 live state core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply transport route authority repair
        run: python scripts/round4_transport_route_fix.py
      - name: Verify core
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q
      - name: Commit verified core
        run: |
          git config user.name "starmerx-luxuyan"
          git config user.email "luxuyan@starmerx.com"
          git add src/sao_mcp/rules/transport.py
          git diff --cached --quiet && exit 1
          git commit -m "Use current NPC route state in special transport"
          git push origin HEAD:main
