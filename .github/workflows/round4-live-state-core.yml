name: Round 4 Live State Core

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round4 live state core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply encounter roster authority repairs
        run: python scripts/round4_live_state_gate_fixes.py
      - name: Verify core
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q
      - name: Commit verified core
        run: |
          git config user.name "starmerx-luxuyan"
          git config user.email "luxuyan@starmerx.com"
          git add src/sao_mcp/rules/raids.py src/sao_mcp/runtime/aincrad_runtime.py src/sao_mcp/scenarios/floor22_witch.py src/sao_mcp/scenarios/floor2_taurus_raid.py src/sao_mcp/scenarios/floor6_buxum.py src/sao_mcp/scenarios/floor6_irrational_cube.py src/sao_mcp/scenarios/floor6_south.py src/sao_mcp/scenarios/floor6_stachion.py src/sao_mcp/scenarios/floor7_aghyellr.py
          git diff --cached --quiet && exit 1
          git commit -m "Route live encounter roster changes through authority layer"
          git push origin HEAD:main
