name: restore-live-v132

# restore after the 2026-09-14 documentation-only main redeploy; keep player state intact while v1.3.3 is developed on a branch
on:
  push:
    branches:
      - ops/restore-live-v132
    paths:
      - .github/workflows/restore-live-v132.yml

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Restore and verify production frontline loop
        run: |
          python - <<'PY'
          import asyncio
          import json
          from mcp import Client
          from scripts.build_kageaki_frontline_recovery_v132 import build_recovery

          ENDPOINT = "https://sao-aincrad-mcp-production.up.railway.app/mcp"
          KAGEAKI = "pc_419ba4144d33"
          REINA = "pc_friend_reina"
          save_json = build_recovery()
          local_save = json.loads(save_json)

          def text_json(result):
              return json.loads(result.content[0].text)

          async def main():
              async with Client(ENDPOINT, raise_exceptions=True) as client:
                  health_before = text_json(await client.call_tool("health", {}))
                  imported = text_json(await client.call_tool("import_save_json", {"save_json": save_json}))
                  exported = text_json(await client.call_tool("export_save_json", {}))
                  assert exported == local_save

                  k_state = text_json(await client.call_tool("get_character_state", {"actor_id": KAGEAKI}))
                  r_state = text_json(await client.call_tool("get_character_state", {"actor_id": REINA}))
                  assert k_state["actor"]["level"] == 7
                  assert k_state["actor"]["hp"] == 1561 and k_state["actor"]["maxHp"] == 1561
                  assert k_state["actor"]["col"] == 88918
                  assert k_state["actor"]["locationId"] == "floor_1_labyrinth"
                  assert r_state["actor"]["level"] == 6
                  assert r_state["actor"]["locationId"] == "floor_1_labyrinth"
                  assert k_state["actor"]["partyId"] == r_state["actor"]["partyId"]
                  star = next(x["proficiency"] for x in k_state["skills"]["equipped"] if x["id"] == "star_sword")
                  assert star == 248.6
                  assert k_state["equipment"]["weapon"]["durability"] == 298

                  observation = text_json(await client.call_tool("get_gm_observation", {"observer_actor_ids": [KAGEAKI, REINA]}))
                  observation_blob = json.dumps(observation, ensure_ascii=False, sort_keys=True)
                  assert "ruin_kobold_trooper" in observation_blob
                  vendors = text_json(await client.call_tool("list_vendors", {"location_id": "floor_1_tolbana"}))
                  assert "npc_smith_tolbana_frontline" in json.dumps(vendors, ensure_ascii=False, sort_keys=True)

              print("HEALTH_BEFORE", json.dumps(health_before, ensure_ascii=False))
              print("IMPORTED", json.dumps(imported, ensure_ascii=False))
              print("KAGEAKI", json.dumps({"level": 7, "hp": [1561,1561], "col": 88918, "starSword": star, "durability": 298}, ensure_ascii=False))
              print("RESTORE_OK", True)
          asyncio.run(main())
          PY
