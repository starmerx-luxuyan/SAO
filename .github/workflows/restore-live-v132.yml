name: restore-live-v132

on:
  push:
    branches:
      - ops/restore-live-v132
    paths:
      - .github/workflows/restore-live-v132.yml

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Diagnose production normalization after restore
        run: |
          python - <<'PY'
          import asyncio
          import json
          from mcp import Client
          from scripts.build_kageaki_frontline_recovery_v132 import build_recovery

          ENDPOINT = "https://sao-aincrad-mcp-production.up.railway.app/mcp"
          save_json = build_recovery()
          local_save = json.loads(save_json)

          def text_json(result):
              return json.loads(result.content[0].text)

          def summarize(value):
              if isinstance(value, dict):
                  return {"type": "dict", "keys": len(value), "sample": list(value)[:12]}
              if isinstance(value, list):
                  return {"type": "list", "len": len(value), "sample": value[:3]}
              return value

          async def main():
              async with Client(ENDPOINT, raise_exceptions=True) as client:
                  before = text_json(await client.call_tool("health", {}))
                  imported = text_json(await client.call_tool("import_save_json", {"save_json": save_json}))
                  exported = text_json(await client.call_tool("export_save_json", {}))
                  k_state = text_json(await client.call_tool("get_character_state", {"actor_id": "pc_419ba4144d33"}))
                  r_state = text_json(await client.call_tool("get_character_state", {"actor_id": "pc_friend_reina"}))

              diff_keys = sorted(key for key in set(local_save) | set(exported) if local_save.get(key) != exported.get(key))
              print("HEALTH_BEFORE", json.dumps(before, ensure_ascii=False))
              print("IMPORTED", json.dumps(imported, ensure_ascii=False))
              print("DIFF_KEYS", json.dumps(diff_keys, ensure_ascii=False))
              for key in diff_keys:
                  left = local_save.get(key)
                  right = exported.get(key)
                  if isinstance(left, dict) and isinstance(right, dict):
                      subkeys = sorted(k for k in set(left) | set(right) if left.get(k) != right.get(k))
                      print("SUBDIFF", key, json.dumps(subkeys[:80], ensure_ascii=False))
                      for sub in subkeys[:12]:
                          print("VALUE", key, sub, "LOCAL", json.dumps(summarize(left.get(sub)), ensure_ascii=False), "LIVE", json.dumps(summarize(right.get(sub)), ensure_ascii=False))
                  else:
                      print("VALUE", key, "LOCAL", json.dumps(summarize(left), ensure_ascii=False), "LIVE", json.dumps(summarize(right), ensure_ascii=False))
              print("KAGEAKI", json.dumps({
                  "name": k_state["actor"]["name"], "level": k_state["actor"]["level"],
                  "hp": [k_state["actor"]["hp"], k_state["actor"]["maxHp"]],
                  "col": k_state["actor"]["col"], "location": k_state["actor"]["locationId"],
                  "party": k_state["actor"]["partyId"],
                  "starSword": next(x["proficiency"] for x in k_state["skills"]["equipped"] if x["id"] == "star_sword"),
                  "durability": k_state["equipment"]["weapon"]["durability"],
              }, ensure_ascii=False))
              print("REINA", json.dumps({
                  "name": r_state["actor"]["name"], "level": r_state["actor"]["level"],
                  "hp": [r_state["actor"]["hp"], r_state["actor"]["maxHp"]],
                  "col": r_state["actor"]["col"], "location": r_state["actor"]["locationId"],
                  "party": r_state["actor"]["partyId"],
              }, ensure_ascii=False))
              if not diff_keys:
                  print("EXACT_MATCH")
          asyncio.run(main())
          PY
