name: floor1-frontline-v132

on:
  push:
    branches:
      - fix/floor1-frontline-v1.3.2
    paths:
      - .github/workflows/floor1-frontline-v132.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply v1.3.2 source patch
        run: |
          python scripts/apply_floor1_frontline_v132.py
          python scripts/apply_floor1_frontline_v132_part2.py
          rm scripts/apply_floor1_frontline_v132.py scripts/apply_floor1_frontline_v132_part2.py
          # The repository connector will update permanent CI after source validation.
          git checkout origin/main -- .github/workflows/ci.yml
      - name: Install patched tree
        run: python -m pip install -e ".[dev]"
      - name: Compile and full regression
        run: |
          python -m compileall -q src
          pytest -q
      - name: Build interrupted-session recovery save
        run: python scripts/build_kageaki_frontline_recovery_v132.py /tmp/SAO_Kageaki_Frontline_Recovery_v1.3.2.save.json
      - name: End-to-end frontline acceptance
        run: |
          python - <<'PY'
          import asyncio
          import json
          from pathlib import Path
          from mcp import Client
          from sao_mcp import server_public
          from sao_mcp.runtime.persistence import import_runtime

          save_json = Path('/tmp/SAO_Kageaki_Frontline_Recovery_v1.3.2.save.json').read_text(encoding='utf-8')
          import_runtime(save_json, into=server_public.runtime)
          k = server_public.runtime.actors['pc_419ba4144d33']
          r = server_public.runtime.actors['pc_friend_reina']
          assert k.location_id == 'floor_1_labyrinth'
          assert r.location_id == 'floor_1_labyrinth'
          assert k.party_id and k.party_id == r.party_id
          assert k.col == 88918
          assert int(k.metadata['experience']) == 2831
          assert k.skill_proficiencies['star_sword'] == 248.60
          assert k.inventory[k.equipment['weapon']].durability == 298
          assert r.col == 2760
          assert r.skill_proficiencies['rapier'] == 214
          assert r.skill_proficiencies['sprint'] == 122

          def text_json(result):
              return json.loads(result.content[0].text)

          async def main():
              async with Client(server_public.mcp, raise_exceptions=True) as client:
                  health = text_json(await client.call_tool('health', {}))
                  obs = text_json(await client.call_tool('get_gm_observation', {
                      'observer_actor_ids': [k.actor_id, r.actor_id]
                  }))
                  vendors = text_json(await client.call_tool('list_vendors', {'location_id': 'floor_1_tolbana'}))
                  exported = text_json(await client.call_tool('export_save_json', {}))
                  tool_names = {tool.name for tool in (await client.list_tools()).tools}
              assert health['version'] == '1.3.2'
              for actor_id in (k.actor_id, r.actor_id):
                  options = obs['viewpoints'][actor_id]['capabilities']['encounter_options']
                  assert any(row['monster_id'] == 'ruin_kobold_trooper' and row['level'] == 6 for row in options)
              assert any(row['vendor_id'] == 'npc_smith_tolbana_frontline' for row in vendors['vendors'])
              assert {'create_party','join_party','list_vendors','sell_to_vendor','buy_from_vendor'} <= tool_names
              assert exported['schema'] == 'sao.aincrad.save.v4'
              print(json.dumps({
                  'version': health['version'],
                  'kageaki': {'location': k.location_id, 'col': k.col, 'xp': k.metadata['experience'], 'starSword': k.skill_proficiencies['star_sword']},
                  'reina': {'location': r.location_id, 'col': r.col, 'rapier': r.skill_proficiencies['rapier']},
                  'encounterOption': 'ruin_kobold_trooper Lv.6',
                  'vendor': 'npc_smith_tolbana_frontline'
              }, ensure_ascii=False))
          asyncio.run(main())
          PY
      - name: Commit tested source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close Floor 1 frontline gameplay loop"
          git push origin HEAD:fix/floor1-frontline-v1.3.2
