name: Round 3 State Authority Autofix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.head_commit.message == 'Run round3 state authority autofix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply state authority repairs
        run: python scripts/round3_state_authority_fix.py
      - name: Verify before commit
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q
      - name: Commit verified repairs
        run: |
          git config user.name "starmerx-luxuyan"
          git config user.email "luxuyan@starmerx.com"
          git add src/sao_mcp/rules/state_authority.py src/sao_mcp/scenarios/floor4_nocturne.py src/sao_mcp/scenarios/floor5_fuscus.py src/sao_mcp/scenarios/floor6_buxum.py src/sao_mcp/scenarios/floor6_elfwar.py src/sao_mcp/scenarios/floor6_stachion.py src/sao_mcp/scenarios/floor8_emergency.py src/sao_mcp/scenarios/floor8_sluva.py tests/test_state_authority.py tests/test_current_state_authority_source.py
          git diff --cached --quiet && exit 1
          git commit -m "Route current-state decisions through authority layer"
          git push origin HEAD:main
