name: correctness-bootstrap

on:
  push:
    branches:
      - correctness-pass-v130-run
    paths:
      - ".correctness/READY"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify and expand payload
        run: |
          cat .correctness/payload-00.b64 .correctness/payload-01.b64 .correctness/safe-03.b64 | base64 -d > /tmp/correctness.tar.xz
          echo "f71d9132d44cdc66352f3a1a18289556634eb5ef4059a7b8185c8a577ce90eac  /tmp/correctness.tar.xz" | sha256sum -c -
          tar -xJf /tmp/correctness.tar.xz -C .
          python .correctness/apply_existing_edits.py

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src

      - name: Full regression
        run: pytest -q

      - name: Build corrected native Day 3 save
        run: python scripts/build_kageaki_day3_save.py /tmp/SAO_Kageaki_Day3_v1.3.0.save.json

      - name: Clean one-shot transport and squash candidate
        run: |
          rm -rf .correctness
          rm -f .github/workflows/correctness-bootstrap.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          TREE=$(git write-tree)
          BASE=$(git rev-parse origin/main)
          COMMIT=$(printf '%s\n' 'fix: complete v1.3 correctness pass' | git commit-tree "$TREE" -p "$BASE")
          git reset --hard "$COMMIT"
          git push --force origin "$COMMIT":correctness-pass-v130-run
