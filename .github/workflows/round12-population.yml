name: Round 12 Population Closure

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round12 population closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply population closure
        run: |
          python scripts/round12_population_patch.py
          python scripts/round12_population_fix.py
      - name: Verify population closure
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q
      - name: Commit verified population closure
        run: |
          git config user.name "starmerx-luxuyan"
          git config user.email "luxuyan@starmerx.com"
          git add src/sao_mcp/rules/population.py src/sao_mcp/runtime/population_runtime.py src/sao_mcp/rules/routing.py src/sao_mcp/server_population.py tests/test_population_abstraction.py tests/test_population_authority.py tests/test_movement_authority_source.py
          git diff --cached --quiet && exit 1
          git commit -m "Seal conserved player population migration"
          git push origin HEAD:main
