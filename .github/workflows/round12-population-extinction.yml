name: Round 12 Population Transit Extinction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round12 transit extinction fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply transit-extinction fix
        run: python scripts/round12_population_extinction_fix.py
      - name: Verify population closure
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q
      - name: Commit verified fix
        run: |
          git config user.name "starmerx-luxuyan"
          git config user.email "luxuyan@starmerx.com"
          git add src/sao_mcp/runtime/population_runtime.py tests/test_population_abstraction.py
          git diff --cached --quiet && exit 1
          git commit -m "Handle extinct cohorts during population transit"
          git push origin HEAD:main
