name: Round 13 Economy Budget

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round13 economy budget fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply regional demand-budget fix
        run: python scripts/round13_economy_budget_fix.py
      - name: Verify regional economy budget
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q
      - name: Commit verified regional budget
        run: |
          git config user.name "starmerx-luxuyan"
          git config user.email "luxuyan@starmerx.com"
          git add src/sao_mcp/rules/economy_loop.py src/sao_mcp/runtime/property_economy.py tests/test_economy_loop.py
          git diff --cached --quiet && exit 1
          git commit -m "Conserve regional market demand and supply budgets"
          git push origin HEAD:main
