name: Round 18 GM Decision Runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run round18 gm decision runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final GM decision audit
        run: python scripts/round18_gm_decision_audit_fix.py
      - name: Verify GM decision runtime
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src
          pytest -q
      - name: Commit verified GM decision audit
        run: |
          git config user.name 'starmerx-luxuyan'
          git config user.email 'luxuyan@starmerx.com'
          git add src/sao_mcp/runtime/gm_decision.py skills/sao-gm/SKILL.md tests/test_gm_decision_runtime.py tests/test_gm_decision_authority.py
          git diff --cached --quiet && exit 1
          git commit -m 'Require fresh observation for every GM decision'
          git push origin HEAD:main
