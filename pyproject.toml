[project]
name = "starmerx-sao-mcp"
dynamic = ["version"]
description = "Sword Art Online Aincrad rules runtime and ChatGPT MCP plugin"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "starmerx-luxuyan"}]
keywords = ["sao", "aincrad", "rpg", "gm", "mcp"]
dependencies = [
    "mcp[cli]>=2.0,<3",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
sao-mcp = "sao_mcp.cli:main"

[project.urls]
Repository = "https://github.com/starmerx-luxuyan/SAO"
Issues = "https://github.com/starmerx-luxuyan/SAO/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sao_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sao_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
