<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boss Raid HUD</title><style>
:root{color-scheme:dark;--bg:#061015;--glass:rgba(8,24,31,.88);--line:rgba(154,227,236,.17);--muted:#83a7af;--cyan:#75d6e1;--green:#5bcf9a;--amber:#f0b85f;--red:#e76579;--ink:#f2feff}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:radial-gradient(circle at 50% -5%,rgba(68,175,193,.19),transparent 31%),linear-gradient(160deg,#050c10,#071820 60%,#03090c);font:13px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;color:var(--ink)}.hud{max-width:1120px;margin:auto;display:grid;gap:12px}.panel{border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(20px);box-shadow:0 20px 55px rgba(0,0,0,.24)}.boss{padding:17px 18px}.top{display:flex;align-items:flex-start;gap:14px}.crest{width:46px;height:46px;border:1px solid rgba(126,218,229,.25);border-radius:14px;display:grid;place-items:center;font-size:22px;color:#9ee8ef;background:rgba(255,255,255,.025)}.info{min-width:0;flex:1}.eyebrow{font-size:9px;letter-spacing:.22em;color:#7ea8b1}.bossName{font-size:20px;font-weight:780;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.phase{font-size:11px;color:#9bc0c8;margin-top:3px}.numbers{text-align:right}.numbers b{display:block;font-size:17px}.numbers span{font-size:10px;color:var(--muted)}.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:15px}.seg{height:11px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;position:relative}.seg i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#d94f68,#f28999);border-radius:99px}.seg.current{outline:1px solid rgba(240,177,95,.55);outline-offset:2px}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.pill{padding:4px 8px;border-radius:99px;background:rgba(117,214,225,.08);color:#a9dce2;font-size:9px;letter-spacing:.05em}.pill.canon{background:rgba(91,207,154,.10);color:#8ce0b7}.tele{display:none;padding:14px 17px;background:linear-gradient(90deg,rgba(208,68,90,.18),rgba(243,170,81,.09));border-color:rgba(238,100,117,.28)}.tele.show{display:block}.teleHead{display:flex;gap:10px;align-items:center}.warning{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(231,101,121,.16);color:#ff9aac;font-size:18px}.teleName{font-weight:780}.teleTargets{font-size:10px;color:#d7aab1;margin-top:2px}.countdown{margin-left:auto;text-align:right}.countdown b{font-size:20px;color:#ffbd82}.countdown small{display:block;color:#b98f83}.teleBar{height:5px;background:rgba(255,255,255,.08);border-radius:99px;margin-top:9px;overflow:hidden}.teleBar i{display:block;height:100%;background:linear-gradient(90deg,#f19b6a,#e65b73)}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:12px}.section{padding:14px}.title{font-size:10px;letter-spacing:.15em;color:#8eb4bc;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between}.title span{color:#5f858e;letter-spacing:.05em}.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.member,.minion{padding:9px 10px;border:1px solid rgba(133,209,218,.1);border-radius:11px;background:rgba(255,255,255,.025);display:flex;gap:9px;align-items:center}.member.targeted{border-color:rgba(231,101,121,.45);background:rgba(231,101,121,.07)}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(91,207,154,.35);flex:0 0 auto}.dot.dead{background:#5b6c70;box-shadow:none}.grow{min-width:0;flex:1}.name{font-weight:680;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:9px;color:var(--muted);margin-top:2px}.hp{height:4px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:5px}.hp i{display:block;height:100%;background:linear-gradient(90deg,#4dc78f,#78d8aa)}.targeted .hp i{background:linear-gradient(90deg,#da5970,#ef8c9c)}.threat{font-size:9px;color:#efc07c}.minions{display:grid;gap:6px}.minion .hp i{background:linear-gradient(90deg,#be596d,#e48494)}.actions{display:grid;gap:6px}.action{padding:9px 10px;border-radius:10px;background:rgba(117,214,225,.045);border-left:2px solid rgba(117,214,225,.36)}.action b{font-size:11px}.action small{display:block;color:var(--muted);margin-top:2px}.events{max-height:260px;overflow:auto}.event{padding:7px 2px;border-bottom:1px dashed rgba(140,211,220,.09);font-size:10px;color:#a5c4ca}.event strong{color:#e9fbfd;font-weight:620}.event:last-child{border-bottom:0}.empty{padding:12px;color:#658991;font-size:11px}.foot{padding:8px 14px;font-size:9px;color:#587a82;letter-spacing:.1em;text-align:right}@media(max-width:780px){body{padding:8px}.grid{grid-template-columns:1fr}.roster{grid-template-columns:1fr}.bossName{font-size:16px}.numbers{display:none}.bars{gap:4px}}</style></head><body><div class="hud">
<section class="panel boss"><div class="top"><div class="crest">◇</div><div class="info"><div class="eyebrow">FLOOR BOSS · AINCRAD</div><div id="bossName" class="bossName">等待 Boss 状态…</div><div id="phase" class="phase">—</div></div><div class="numbers"><b id="bossHp">—</b><span>HIT POINTS</span></div></div><div id="bars" class="bars"></div><div id="meta" class="meta"></div></section>
<section id="tele" class="panel tele"><div class="teleHead"><div class="warning">!</div><div><div id="teleName" class="teleName">TELEGRAPH</div><div id="teleTargets" class="teleTargets"></div></div><div class="countdown"><b id="remain">0 ms</b><small>EXECUTION WINDOW</small></div></div><div class="teleBar"><i id="teleProgress"></i></div></section>
<div class="grid"><section class="panel section"><div class="title">Raid Members <span id="raidCount"></span></div><div id="players" class="roster"></div></section><div style="display:grid;gap:12px"><section class="panel section"><div class="title">Ruin Kobold Sentinels <span id="minionCount"></span></div><div id="minions" class="minions"></div></section><section class="panel section"><div class="title">Current Phase Actions</div><div id="actions" class="actions"></div></section></div></div>
<section class="panel section"><div class="title">Boss Event Stream <span id="time"></span></div><div id="events" class="events"></div></section><div class="foot">MECHANICAL STATE · UI DOES NOT RE-CALCULATE COMBAT</div></div><script>
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pct=x=>Math.max(0,Math.min(100,(Number(x)||0)*100));function render(v){if(!v?.boss)return;const b=v.boss;$('bossName').textContent=b.name;$('phase').textContent=`PHASE · ${b.phaseName} · ${b.alive?'ACTIVE':'DEFEATED'}`;$('bossHp').textContent=`${Number(b.hp).toLocaleString()} / ${Number(b.maxHp).toLocaleString()}`;$('bars').innerHTML=(b.bars||[]).map((x,i)=>`<div class="seg ${!x.depleted&&((b.bars||[]).slice(0,i).every(y=>y.depleted))?'current':''}"><i style="width:${pct(x.ratio)}%"></i></div>`).join('');$('meta').innerHTML=`<span class="pill">Floor ${b.floor}</span><span class="pill">${b.hpBars} HP Bars</span><span class="pill">Phase ${esc(b.phase)}</span><span class="pill">Sentinels spawned ${b.sentinelsSpawned}</span><span class="pill ${v.provenance?.kind==='canon'?'canon':''}">${esc(v.provenance?.kind||'provenance')}</span>`;const t=v.telegraph;$('tele').classList.toggle('show',!!t);if(t){$('teleName').textContent=t.name;$('teleTargets').textContent=`TARGET · ${t.targetIds.join(' · ')}`;$('remain').textContent=`${t.remainingMs} ms`;$('teleProgress').style.width=pct(t.remainingMs/Math.max(1,t.telegraphMs))+'%'}$('raidCount').textContent=`${v.raid.livingPlayers}/${v.raid.playerCount} alive`;$('players').innerHTML=v.players.map(p=>`<div class="member ${p.targeted?'targeted':''}"><i class="dot ${p.alive?'':'dead'}"></i><div class="grow"><div class="name">${esc(p.name)} · Lv.${p.level}</div><div class="sub">HP ${p.hp}/${p.maxHp} · recovery ${p.recoveryRemainingMs}ms</div><div class="hp"><i style="width:${pct(p.hpRatio)}%"></i></div></div><div class="threat">T ${p.threat}</div></div>`).join('')||'<div class="empty">No raid members</div>';$('minionCount').textContent=`${v.raid.livingMinions} alive / ${v.raid.totalMinionsSpawned} spawned`;$('minions').innerHTML=v.minions.map(m=>`<div class="minion"><i class="dot ${m.alive?'':'dead'}"></i><div class="grow"><div class="name">${esc(m.name)}</div><div class="sub">HP ${m.hp}/${m.maxHp}</div><div class="hp"><i style="width:${pct(m.hpRatio)}%"></i></div></div></div>`).join('')||'<div class="empty">No Sentinels</div>';$('actions').innerHTML=(b.availableActions||[]).map(a=>`<div class="action"><b>${esc(a.name)}</b><small>${a.telegraph_ms}ms telegraph · ${a.max_targets} target${a.max_targets===1?'':'s'} · ×${a.damage_multiplier} · ${a.reach_m}m</small></div>`).join('');$('events').innerHTML=(v.events||[]).slice().reverse().map(e=>`<div class="event"><strong>${esc(e.event_type)}</strong> · ${esc(e.actor_id||'system')} → ${esc(e.target_id||'—')}</div>`).join('')||'<div class="empty">No events</div>';$('time').textContent=`t=${v.encounter.timeMs} ms`}
window.addEventListener('message',ev=>{const text=ev.data?.result?.content?.[0]?.text;if(!text)return;try{render(JSON.parse(text))}catch(err){console.error(err)}});</script></body></html>
