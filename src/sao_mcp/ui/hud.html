<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aincrad HUD</title>
<style>
:root{color-scheme:dark;--glass:rgba(13,27,36,.78);--line:rgba(168,232,241,.24);--aqua:#74d6e5;--aqua2:#b9f5ff;--text:#eefbff;--muted:#8faab5;--danger:#ff7e91;--warn:#ffd48a;--ok:#79e6b2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 85% 10%,rgba(50,159,178,.20),transparent 32%),radial-gradient(circle at 10% 100%,rgba(49,100,147,.18),transparent 36%),#071117;padding:14px}.shell{max-width:880px;margin:auto;border:1px solid var(--line);border-radius:24px;background:linear-gradient(155deg,rgba(27,49,60,.88),rgba(7,17,23,.86));box-shadow:0 24px 80px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.05);overflow:hidden;backdrop-filter:blur(22px)}.top{display:flex;gap:18px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.level{width:58px;height:58px;border-radius:18px;border:1px solid rgba(185,245,255,.32);display:grid;place-items:center;background:rgba(116,214,229,.08);box-shadow:inset 0 0 22px rgba(116,214,229,.08)}.level b{font-size:22px;color:var(--aqua2)}.main{min-width:0;flex:1}.nameRow{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}.name{font-size:19px;font-weight:750;letter-spacing:.02em}.location{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hpHead{display:flex;justify-content:space-between;color:#cfe9ef;font-size:12px;margin-bottom:5px}.track{height:10px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;border:1px solid rgba(255,255,255,.05)}.fill{height:100%;width:0;background:linear-gradient(90deg,#51dfab,#8af1c5);box-shadow:0 0 16px rgba(81,223,171,.35);transition:width .35s ease}.fill.low{background:linear-gradient(90deg,#ff6e80,#ff9da9)}.cursor{width:11px;height:11px;border-radius:50%;box-shadow:0 0 10px currentColor}.content{padding:16px 18px 18px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.card{border:1px solid var(--line);border-radius:17px;background:rgba(7,17,23,.48);padding:14px}.title{display:flex;align-items:center;justify-content:space-between;color:#cbe9f0;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:11px}.badge{font-size:11px;letter-spacing:0;text-transform:none;color:var(--aqua2);padding:3px 7px;border-radius:99px;border:1px solid rgba(116,214,229,.24);background:rgba(116,214,229,.07)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{padding:9px;border-radius:12px;background:rgba(255,255,255,.035);text-align:center}.stat b{display:block;font-size:17px;color:#fff}.stat span{color:var(--muted);font-size:10px;letter-spacing:.08em}.weapon{display:flex;align-items:center;gap:12px}.blade{width:38px;height:38px;border-radius:12px;border:1px solid rgba(116,214,229,.25);display:grid;place-items:center;color:var(--aqua2);font-size:18px;background:rgba(116,214,229,.06)}.weaponName{font-weight:700}.sub{font-size:12px;color:var(--muted)}.dur{height:5px;margin-top:7px}.skill{margin:9px 0}.skillHead{display:flex;justify-content:space-between;font-size:12px}.skill .track{height:5px;margin-top:4px}.skill .fill{background:linear-gradient(90deg,#65bdd7,#b8ecf7);box-shadow:none}.inventory{display:grid;gap:6px;max-height:214px;overflow:auto;padding-right:2px}.item{display:flex;gap:8px;align-items:center;padding:8px 9px;border-radius:11px;background:rgba(255,255,255,.03)}.item .qty{margin-left:auto;color:var(--muted)}.combat{grid-column:1/-1}.enemy{display:grid;grid-template-columns:1fr auto;gap:5px 12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.05)}.enemy:first-of-type{border-top:0}.enemy .track{grid-column:1/-1;height:6px}.enemy .fill{background:linear-gradient(90deg,#f27d8e,#ffc0c8);box-shadow:none}.events{margin-top:10px;display:grid;gap:5px}.event{font-size:12px;color:#a9c4cd;padding-left:10px;border-left:2px solid rgba(116,214,229,.32)}.empty{color:var(--muted);padding:10px 0}.footer{display:flex;justify-content:space-between;gap:8px;margin-top:12px;color:var(--muted);font-size:11px}.warn{color:var(--warn)}.danger{color:var(--danger)}@media(max-width:680px){body{padding:0}.shell{border-radius:0;border-left:0;border-right:0;min-height:100vh}.grid{grid-template-columns:1fr}.combat{grid-column:auto}.stats{grid-template-columns:repeat(2,1fr)}.top{padding:15px}.content{padding:12px}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="level"><div><span style="font-size:9px;color:var(--muted);display:block;text-align:center">LV</span><b id="level">--</b></div></div>
    <div class="main">
      <div class="nameRow"><span id="cursor" class="cursor"></span><span id="name" class="name">Aincrad</span><span id="location" class="location">等待角色状态…</span></div>
      <div class="hpHead"><span>HP</span><span id="hpText">-- / --</span></div>
      <div class="track"><div id="hpFill" class="fill"></div></div>
    </div>
  </div>
  <div class="content">
    <div class="grid">
      <section class="card"><div class="title">Parameters <span id="state" class="badge">READY</span></div><div id="stats" class="stats"></div></section>
      <section class="card"><div class="title">Equipment <span id="weight" class="badge">--</span></div><div id="weapon"></div></section>
      <section class="card"><div class="title">Skills <span id="slots" class="badge">-- / --</span></div><div id="skills"></div></section>
      <section class="card"><div class="title">Inventory <span id="col" class="badge">0 Col</span></div><div id="inventory" class="inventory"></div></section>
      <section id="combatCard" class="card combat" hidden><div class="title">Encounter <span id="zone" class="badge"></span></div><div id="enemies"></div><div id="events" class="events"></div></section>
    </div>
    <div class="footer"><span>AINCRAD SYSTEM · runtime state is authoritative</span><span id="cooldown"></span></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bar(r){return Math.max(0,Math.min(1,Number(r)||0))*100}
function render(v){if(!v?.actor)return;const a=v.actor;$('level').textContent=a.level;$('name').textContent=a.name;$('location').textContent=a.locationId||'Unknown Area';$('hpText').textContent=`${a.hp.toLocaleString()} / ${a.maxHp.toLocaleString()}`;$('hpFill').style.width=bar(a.hpRatio)+'%';$('hpFill').classList.toggle('low',a.hpRatio<.25);$('state').textContent=(a.combatState||'ready').toUpperCase();$('cursor').style.color=a.cursor==='orange'?'#ff9a55':a.cursor==='red'?'#ff647a':'#78e8b5';$('cursor').style.background='currentColor';$('col').textContent=(a.col||0).toLocaleString()+' Col';$('stats').innerHTML=[['STR',a.strength],['AGI',a.agility],['ARM',a.armor],['CUR',a.cursor.toUpperCase()]].map(([k,x])=>`<div class="stat"><b>${esc(x)}</b><span>${k}</span></div>`).join('');$('weight').textContent=`${v.weight.current} / ${v.weight.capacity}`;
const w=v.equipment?.weapon;if(w){const dr=w.maxDurability?bar(w.durability/w.maxDurability):100;$('weapon').innerHTML=`<div class="weapon"><div class="blade">◇</div><div style="flex:1"><div class="weaponName">${esc(w.name)}${w.broken?' <span class="danger">BROKEN</span>':''}</div><div class="sub">${Object.entries(w.enhancements||{}).map(([k,n])=>`${esc(k)} +${n}`).join(' · ')||'No enhancement'}</div><div class="track dur"><div class="fill" style="width:${dr}%"></div></div><div class="sub">Durability ${w.durability??'--'} / ${w.maxDurability??'--'} · Attempts ${w.attemptsUsed}/${w.maxAttempts}</div></div></div>`}else $('weapon').innerHTML='<div class="empty">No weapon equipped</div>';
$('slots').textContent=`${v.skills.slotsUsed} / ${v.skills.slotsTotal}`;$('skills').innerHTML=v.skills.equipped.map(s=>`<div class="skill"><div class="skillHead"><span>${esc(s.name)}</span><span>${Math.round(s.proficiency)} / 1000</span></div><div class="track"><div class="fill" style="width:${bar(s.proficiency/1000)}%"></div></div></div>`).join('')||'<div class="empty">No skills equipped</div>';
$('inventory').innerHTML=v.inventory.map(i=>`<div class="item"><span>${i.equipped?'◆':'◇'}</span><span><b>${esc(i.name)}</b><span class="sub"> · ${esc(i.kind)}</span></span><span class="qty">×${i.quantity}</span></div>`).join('')||'<div class="empty">Inventory empty</div>';
const cd=v.cooldownsMs?.potion;$('cooldown').textContent=cd?`Potion CD ${(cd/1000).toFixed(1)}s`:'';const e=v.encounter;$('combatCard').hidden=!e;if(e){$('zone').textContent=(e.safeZone?'SAFE · ':'')+(e.antiCrystal?'ANTI-CRYSTAL · ':'')+e.zoneId;$('enemies').innerHTML=e.participants.map(x=>`<div class="enemy"><b>${esc(x.name)}</b><span>${x.hp.toLocaleString()} / ${x.maxHp.toLocaleString()}</span><div class="track"><div class="fill" style="width:${bar(x.hpRatio)}%"></div></div></div>`).join('');$('events').innerHTML=e.recentEvents.slice(-5).map(x=>`<div class="event">${esc(x.event_type)}${x.payload?.damage?` · ${x.payload.damage} dmg`:''}${x.payload?.sword_skill?` · ${esc(x.payload.sword_skill)}`:''}</div>`).join('')}}
window.addEventListener('message',ev=>{const text=ev.data?.result?.content?.[0]?.text;if(!text)return;try{render(JSON.parse(text))}catch{}});
</script>
</body></html>
